name: Deploy to GitHub Pages

# Publishes the single-file app (index.html at repo root) to GitHub Pages.
# Runs from the repo's default branch (the only branch the github-pages
# environment permits by default).
# Live URL: https://alt-meridian-josh.github.io/Strategic-Value/
#   Macy's example: https://alt-meridian-josh.github.io/Strategic-Value/?example=macys

on:
  push:
    branches:
      - claude/add-nrv-value-decay-FBXnk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Self-enable Pages (source = GitHub Actions) if it isn't already.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
